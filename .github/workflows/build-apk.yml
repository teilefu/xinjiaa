name: 打包星迹日历APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev cmake

      - name: 安装 buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: 强制使用兼容NDK并打包 APK
        run: |
          sed -i '/^\[app\]/a android.ndk_version = 25c' buildozer.spec
          sed -i '/^\[app\]/a android.accept_sdk_license = True' buildozer.spec
          grep -n 'ndk_version\|accept_sdk' buildozer.spec
          yes | buildozer -v android debug

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name: 星迹日历-APK
          path: bin/*.apk
